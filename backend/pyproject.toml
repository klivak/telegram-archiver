[project]
name = "tgarchiver"
version = "0.1.0"
description = "Telegram Archiver - local-first archiver for your own Telegram account"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "telethon>=1.45",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "aiosqlite>=0.20",
    "keyring>=25",
    "httpx>=0.27",   # AI providers + update check
    "qrcode>=8",     # render login QR as SVG locally (no external QR service)
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1"]
miniapps = ["playwright>=1.45"]
fast = ["cryptg>=0.4"]  # native AES for faster media downloads

[project.scripts]
tgarchiver = "tgarchiver.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tgarchiver"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# ASYNC2xx: small local file ops / opening Explorer are fine in this single-user desktop app.
ignore = ["B008", "ASYNC109", "ASYNC220", "ASYNC230", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
